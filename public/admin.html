<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorPlaza Bots — Admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #1e1f22; color: #e3e5e8; margin: 0; }
  header { background: #2b2d31; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card { background: #2b2d31; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: #2b2d31; border-radius: 10px; padding: 16px; text-align: center; }
  .stat .n { font-size: 28px; font-weight: 700; color: #5865f2; }
  .stat .l { font-size: 12px; color: #949ba4; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #1e1f22; }
  th { color: #949ba4; font-size: 12px; text-transform: uppercase; }
  select, input, button { background: #383a40; color: #e3e5e8; border: 1px solid #4e5058; border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  button { background: #5865f2; border: none; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.danger { background: #da373c; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge.premium { background: #faa81a; color: #000; }
  .badge.free { background: #4e5058; }
  .badge.admin { background: #5865f2; }
  .badge.online { background: #248046; }
  .badge.suspended { background: #da373c; }
  .badge.offline, .badge.error { background: #da373c; }
  #loginView { max-width: 360px; margin: 80px auto; }
  #loginView input { width: 100%; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .err { color: #da373c; font-size: 13px; margin-top: 8px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
</style>
</head>
<body>
<header>
  <h1>🛠 CreatorPlaza Bots — Admin</h1>
  <div class="spacer"></div>
  <span id="who" style="font-size:13px;color:#949ba4"></span>
  <button id="logoutBtn" class="hidden danger">Log out</button>
</header>
<main>
  <div id="loginView" class="card">
    <h2>Admin login</h2>
    <input id="lu" placeholder="Username" autocomplete="username">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" style="width:100%">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="adminView" class="hidden">
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>Users</h2>
      <table>
        <thead><tr><th>User</th><th>Plan</th><th>Role</th><th>Bots</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>All bots</h2>
      <table>
        <thead><tr><th>Name</th><th>Owner</th><th>Status</th><th>Created</th></tr></thead>
        <tbody id="botsBody"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('admin_token') || '';

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || ('HTTP ' + res.status));
  return data;
}

function badge(cls, text) { return `<span class="badge ${cls}">${text}</span>`; }

async function loadStats() {
  const s = await api('GET', '/api/admin/stats');
  $('stats').innerHTML = [
    ['Users', s.users], ['Bots', s.bots], ['Online', s.onlineBots],
    ['Premium', s.premiumUsers], ['Suspended', s.suspendedUsers], ['Shares', s.shares],
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

async function loadUsers() {
  const { users } = await api('GET', '/api/admin/users');
  $('usersBody').innerHTML = users.map(u => `
    <tr>
      <td>@${esc(u.username)} ${u.suspended ? badge('suspended', 'SUSPENDED') : ''}</td>
      <td>${badge(u.plan === 'premium' ? 'premium' : 'free', u.plan)}</td>
      <td>${u.role === 'admin' ? badge('admin', 'admin') : badge('free', 'user')}</td>
      <td>${u.bot_count}</td>
      <td>${esc(u.created_at)}</td>
      <td>
        <select data-id="${u.id}" class="planSel">
          <option value="free" ${u.plan === 'free' ? 'selected' : ''}>free</option>
          <option value="premium" ${u.plan === 'premium' ? 'selected' : ''}>premium</option>
        </select>
        <select data-id="${u.id}" class="roleSel" style="margin-left:6px">
          <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
        </select>
        <button class="susBtn ${u.suspended ? '' : 'danger'}" data-id="${u.id}" data-sus="${u.suspended ? 1 : 0}" style="margin-left:6px">
          ${u.suspended ? 'Unsuspend' : 'Suspend'}
        </button>
      </td>
    </tr>`).join('');

  document.querySelectorAll('.planSel').forEach(sel => sel.onchange = async () => {
    try { await api('POST', `/api/admin/users/${sel.dataset.id}/plan`, { plan: sel.value }); loadUsers(); }
    catch (e) { alert(e.message); }
  });
  document.querySelectorAll('.roleSel').forEach(sel => sel.onchange = async () => {
    try { await api('POST', `/api/admin/users/${sel.dataset.id}/role`, { role: sel.value }); loadUsers(); }
    catch (e) { alert(e.message); }
  });
  document.querySelectorAll('.susBtn').forEach(btn => btn.onclick = async () => {
    const suspend = btn.dataset.sus !== '1';
    if (suspend && !confirm('Suspend this user? Their bots will be shut off (not deleted).')) return;
    try {
      const r = await api('POST', `/api/admin/users/${btn.dataset.id}/suspend`, { suspended: suspend });
      if (r.stoppedBots) alert(`Suspended — ${r.stoppedBots} bot(s) shut off.`);
      loadUsers(); loadStats();
    } catch (e) { alert(e.message); }
  });
}

async function loadBots() {
  const { bots } = await api('GET', '/api/admin/bots');
  $('botsBody').innerHTML = bots.map(b => `
    <tr>
      <td>${esc(b.name)}</td><td>@${esc(b.owner)}</td>
      <td>${badge(b.status === 'online' ? 'online' : 'offline', b.status)}</td>
      <td>${esc(b.created_at)}</td>
    </tr>`).join('');
}

function esc(s) { return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

async function refresh() { await Promise.all([loadStats(), loadUsers(), loadBots()]); }

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('lu').value.trim(), password: $('lp').value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    token = data.token;
    localStorage.setItem('admin_token', token);
    const me = await api('GET', '/api/me');
    if (!me.user.admin) { token=''; localStorage.removeItem('admin_token'); throw new Error('This account is not an admin'); }
    showAdmin(me.user.username);
    await refresh();
  } catch (e) { $('loginErr').textContent = e.message; }
};

$('logoutBtn').onclick = () => {
  token = ''; localStorage.removeItem('admin_token');
  $('adminView').classList.add('hidden'); $('loginView').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden'); $('who').textContent = '';
};

function showAdmin(username) {
  $('loginView').classList.add('hidden'); $('adminView').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden'); $('who').textContent = '@' + username;
}

// auto-login if token still valid
(async () => {
  if (!token) return;
  try {
    const me = await api('GET', '/api/me');
    if (me.user.admin) { showAdmin(me.user.username); await refresh(); }
    else { token=''; localStorage.removeItem('admin_token'); }
  } catch { token=''; localStorage.removeItem('admin_token'); }
})();
</script>
</body>
</html>
