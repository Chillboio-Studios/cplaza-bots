name: Desktop Builds (Windows + Linux)

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        working-directory: client
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        working-directory: client
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "..\creatorplaza-bots-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: creatorplaza-bots-windows
          path: creatorplaza-bots-windows.zip
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Linux release
        working-directory: client
        run: flutter build linux --release

      - name: Package
        working-directory: client
        run: tar -czf ../creatorplaza-bots-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: creatorplaza-bots-linux
          path: creatorplaza-bots-linux.tar.gz
          retention-days: 14
